# dsh-armor-lite bundle patch
#
# 两件互相独立的事，别再混在一起看：
#   层A 权限层（sandbox-policy / approval）—— 决定「能不能写文件、要不要审批」
#   层B 提示词层（下面 insert 的那行）—— 决定「说什么、说多全」
# 提示词增强只属于层B。层A 放这么宽是为了工作流顺手，不是因为提示词增强需要它。
# 想恢复官方默认（只读沙箱 + 手动审批）：把下面两行注释掉即可，提示词层不受影响。

# ── 层A：权限放行（与提示词增强无关，按需保留）──
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- insert:
    - id: armor-lite
      name: 'dsh-armor-lite'
      config:
        enabled: true

        # ── 人设与本地规则：文本一律从 $DSH_HOME\armor\*.md 读，不放这里 ──
        # 人设段取值优先级：内联 persona → personaFile → 人设库（active.json 指向的
        #   personas\<id>\persona.md，库模式会前置 personas\_base\hard-rules.md）
        #   → legacy（$DSH_HOME\armor\persona.md）→ 内置 personas\default.md
        # 规则段不进库（本机 Windows 写法 / 服务器 Linux 写法，同一份内容不通用）：
        #   $DSH_HOME\armor\rules.md → 段 armor:rules（order -1400，紧跟人设之后）
        # 两个文件都可以在侧栏「提示词增强」面板里直接改、直接存。
        persona: ''
        personaFile: ''
        # v0.6.0 降级：10 排在 harness:identity(-1000) 与 deployment:persona-prefix(0) 之后。
        # 旧值 -1500 是"前置压制"（人设先于官方身份句），属于改写派的残留；
        # 追加式不需要抢占位置 —— 官方段原样在前，本插件接在后面。
        personaOrder: 10
        rules: ''
        rulesFile: ''
        rulesOrder: 20

        # ── 人设库 ──
        # 留空即默认：$DSH_HOME\armor\personas 与 $DSH_HOME\armor\active.json
        personaDir: ''
        activeFile: ''
        # 硬约束片段目录（相对 personaDir）：'default' = _base；'' = 不拼
        baseFragment: 'default'
        # {{cwd}} / {{model}} / {{home}} / {{date}} 的最小替换；未知 {{...}} 原样保留
        # （刻意不用宿主插值：它对未知引用直接抛错，整轮请求会失败）
        interpolateVars: true

        # ── 执行契约（追加层，v0.5.0 主体）──
        # 正文走 $DSH_HOME\armor\execution-mode.md → 内置 personas/default-execution-mode.md
        # 段名 armor:execution-mode，order 30：紧跟 deployment:persona-prefix(0)，在第一方指导之前。
        # 只追加，不改写 —— 官方段一个字不动。
        executionMode: ''
        executionModeFile: ''
        executionModeOrder: 30

        # ── 组装后改写：默认全关（v0.5.0 起）──
        # 打开它们就回到旧的「改写式」：删官方身份句、正则改写官方措辞。
        # 代价是官方一改文案就静默空转，且正则跨行的坑要自己盯着。
        # 只想应急时，用面板上的「层模式」看当前到底挂没挂改写层。
        strip: false
        stripContexts: false
        stripTools: false
        # 按段名整段剔除：默认空 = 官方身份句与 preset persona 原样保留
        dropSections: []
        # 按段名整段替换：{ '段名': '新文本' }
        replaceSections: {}
        # 自定义改写表（{ pattern, flags, replace }）；null = 用 strip-rules.js
        stripRules: null
        # 掐掉全部动态 runtime 上下文（等价 includeRuntimeContext:false）
        suppressRuntimeContext: false

        # ── 拒答恢复 / 空转续写（事件层，实现见 refusal-recover.js）──
        refusalRecover: true
        refusalRecoverMax: 2
        # 连续拒答链上限（拒答→补话→又拒答 每轮都是新 turn，per-turn 上限拦不住）0 = 不限
        refusalRecoverChainMax: 3
        # 留空 = 用 refusal-recover.js 里的内置补话
        refusalRecoverText: ''
        # 拒答词只在这条回复的开头 N 字符内判定，避免误伤正常回答里的「抱歉」
        refusalRecoverHeadLimit: 240
        # 只在 reason.kind === 'max-tokens'（被截断）时补话，不碰 error / aborted
        autoContinue: true
        autoContinueMax: 3
        autoContinueText: '继续'
        # 不替子代理兜底，避免父子互相恢复绕圈
        skipSubagentRecover: true
        # 硬停白名单（字符串按正则源处理）；null = 用内置
        hardStopPatterns: null

        # ── 运维 ──
        watchIntervalMs: 2000
        # 调试输出在桌面端看不到（logs 为空），排障只能靠会话日志的 system 节点
        dumpSections: false
        verbose: false
