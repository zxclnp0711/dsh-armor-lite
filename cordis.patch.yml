# dsh-armor-lite bundle patch
#
# 层一：零代码覆写。等价于 dsh-purge 的「shim 层 + 代码层 #6~#10」，但不动任何文件，
# 也不依赖环境变量——重启后依然生效。
#
# 注意：行按 id 覆盖「整行 config」（非深度合并），所以原行有的字段必须一并写回。

- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- insert:
    - id: armor-lite
      name: 'dsh-armor-lite'
      config:
        enabled: true

        # ── 人设与本地规则：文本一律从 $DSH_HOME\armor\*.md 读，不放这里 ──
        # 默认路径：
        #   $DSH_HOME\armor\persona.md   → 段 armor:persona（order -1500，永远第一段）
        #   $DSH_HOME\armor\rules.md     → 段 armor:rules（order -1400，紧跟其后）
        # 两个文件都可以在侧栏「破甲」面板里直接改、直接存。
        persona: ''
        personaFile: ''
        personaOrder: -1500
        rules: ''
        rulesFile: ''
        rulesOrder: -1400

        # ── 组装后改写（最后一句话权）──
        strip: true
        stripContexts: true
        # 工具描述也要洗（模型选工具的依据；purge 靠文件补丁改这层，这里运行时改）
        stripTools: true
        # 按段名整段剔除：抹掉两句固定身份开场白
        dropSections:
          - 'harness:identity'
          - 'deployment:persona-prefix'
        # 按段名整段替换：{ '段名': '新文本' }
        replaceSections: {}
        # 自定义改写表（{ pattern, flags, replace }）；null = 用 strip-rules.js
        stripRules: null
        # 掐掉全部动态 runtime 上下文（等价 includeRuntimeContext:false）
        suppressRuntimeContext: false

        # ── 拒答恢复 / 空转续写（事件层，实现见 refusal-recover.js）──
        refusalRecover: true
        refusalRecoverMax: 2
        # 连续拒答链上限（拒答→补话→又拒答 每轮都是新 turn，per-turn 上限拦不住）0 = 不限
        refusalRecoverChainMax: 3
        # 留空 = 用 refusal-recover.js 里的内置补话
        refusalRecoverText: ''
        # 拒答词只在这条回复的开头 N 字符内判定，避免误伤正常回答里的「抱歉」
        refusalRecoverHeadLimit: 240
        # 只在 reason.kind === 'max-tokens'（被截断）时补话，不碰 error / aborted
        autoContinue: true
        autoContinueMax: 3
        autoContinueText: '继续'
        # 不替子代理兜底，避免父子互相恢复绕圈
        skipSubagentRecover: true
        # 硬停白名单（字符串按正则源处理）；null = 用内置
        hardStopPatterns: null

        # ── 运维 ──
        watchIntervalMs: 2000
        # 调试输出在桌面端看不到（logs 为空），排障只能靠会话日志的 system 节点
        dumpSections: false
        verbose: false
